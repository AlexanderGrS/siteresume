services:
  nginx:
    image: nginx:1.27-alpine
    container_name: portfolio-nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./front:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - portfolio

networks:
  portfolio:
    driver: bridge