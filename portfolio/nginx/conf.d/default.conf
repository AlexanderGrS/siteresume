# 1. Редирект с .com и .net на основной .de
server {
    listen 80;
    server_name tepliakovgo.com www.tepliakovgo.com tepliakovgo.net www.tepliakovgo.net;
    return 301 https://tepliakovgo.de$request_uri;
}

# 2. Редирект с HTTP на HTTPS для основного домена
server {
    listen 80;
    server_name tepliakovgo.de www.tepliakovgo.de;
    return 301 https://tepliakovgo.de$request_uri;
}

# 3. Основной сервер с HTTPS
server {
    listen 443 ssl;
    server_name tepliakovgo.de www.tepliakovgo.de;

    # Пути к сертификатам (Certbot положит их сюда)
    ssl_certificate /etc/letsencrypt/live/tepliakovgo.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tepliakovgo.de/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ~* \.(css|js|png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        expires 7d;
        # add_header Cache-Control "public, max-age=604800, immutable"; 
    }
}