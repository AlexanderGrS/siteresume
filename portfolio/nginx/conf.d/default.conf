# 1. Редирект с .com и .net на основной .de
server {
    listen 80;
    server_name tepliakovgo.com www.tepliakovgo.com tepliakovgo.net www.tepliakovgo.net;
    return 301 https://tepliakovgo.de$request_uri;
}

# 2. Временный сервер для домена .de (только HTTP)
server {
    listen 80;
    server_name tepliakovgo.de www.tepliakovgo.de;

    # Этот блок нужен для Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Временно отключаем редирект на HTTPS, чтобы Certbot прошел проверку
    # return 301 https://tepliakovgo.de$request_uri;
    
    # Просто отдаем файлы сайта
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 3. Блок с HTTPS временно закомментирован (убран), 
# так как сертификатов еще нет!